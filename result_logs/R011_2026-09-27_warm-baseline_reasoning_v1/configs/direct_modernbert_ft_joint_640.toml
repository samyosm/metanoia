# Direct scorer with a fine-tuned ModernBERT encoder and joint candidate encoding: each
# candidate is encoded together with the question and context (N passes per request).
# 640 tokens for reasoning_v1 (padded, depth up to 8). Same weights layout as the
# 384-token config, so it can warm-start from bundles of that config (init_from).
name = "direct_modernbert_ft_joint_640"

[encoder]
kind = "hf"
model = "answerdotai/ModernBERT-base"
revision = "8949b909ec900327062f0ebf497f51aef5e6f0c8"
max_length = 640
pooling = "mean"
frozen = false
gradient_checkpointing = true

[scorer]
kind = "direct"
latent_dim = 256
heads = 4
hidden_dim = 512
dropout = 0.1
candidate_encoding = "joint"
