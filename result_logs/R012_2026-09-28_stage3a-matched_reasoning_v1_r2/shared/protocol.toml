# Promoted suites are immutable: fix a bug by adding a new revision, not by editing.
suite_id = "reasoning_v1"
revision = 2
task = "exclusive_choice"
question = """
Depth extrapolation (decision 0007): trained on Horn-rule derivations of depth 1-3, how
accurately and how reliably does a predictor choose the entity that provably holds a
target property at held-out depths 4-8? Every example has 46 sentences, so input length
does not track depth. The primary endpoint is accuracy and NLL per held-out depth, and
(revision 2) how they change with the reasoning budget: 0, 1, 2, 4, 8 and 16 workspace
rounds (H1; decision 0008). Rounds beyond those used in training test budget
extrapolation. A direct predictor returns the same answer at every budget.
"""
analysis_specification = "analysis/specifications/core_v0.toml"

[dataset]
# Regenerate with: metanoia-research prepare --config configs/data/microworld_v1.toml
dataset_id = "microworld_v1"
cases_sha256 = "e828fb9f012a7a106cfdb4cb77b00b656a370b6cb35ad53dd37eef52c2e64f3a"
labels_sha256 = "ace50c606346bd9205c544859f75c9e2be112772d7f5cddf29761a5832e18a94"

[evaluation]
splits = ["dev", "calibration", "test"]
batch_size = 8
repeats = 1
base_seed = 0
trace = "off"
failure_policy = "uniform"
timing_scope = "decide_call"

[[budgets]]
id = "b0"
# All limits zero: the direct scorer without graph work.

[[budgets]]
id = "r1"
[budgets.budget]
max_rounds = 1
max_nodes = 64
max_pairs = 4096

[[budgets]]
id = "r2"
[budgets.budget]
max_rounds = 2
max_nodes = 64
max_pairs = 8192

[[budgets]]
id = "r4"
[budgets.budget]
max_rounds = 4
max_nodes = 64
max_pairs = 16384

[[budgets]]
id = "r8"
[budgets.budget]
max_rounds = 8
max_nodes = 64
max_pairs = 32768

[[budgets]]
id = "r16"
[budgets.budget]
max_rounds = 16
