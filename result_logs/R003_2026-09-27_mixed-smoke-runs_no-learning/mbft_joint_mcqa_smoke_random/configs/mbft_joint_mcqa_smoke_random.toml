name = "mbft_joint_mcqa_smoke_random"
# Smoke run: validates the pipeline on a random 2,400-example train sample (~10 min on an RTX 2060).
model_config_path = "configs/models/direct_modernbert_ft_joint.toml"
dataset = "artifacts/datasets/mcqa_v0"
train_split = "train"
dev_split = "dev"
batch_size = 16
micro_batch_size = 4
learning_rate = 1e-4
encoder_learning_rate = 2e-5
weight_decay = 0.01
warmup_fraction = 0.06
schedule = "linear"
precision = "fp16-mixed"
grad_clip = 1.0
seed = 0
device = "cuda"
log_every_steps = 50
epochs = 1
max_train_examples = 2400
subset = "random"
max_dev_examples = 400
