name = "mbft_joint_reasoning_train20k"
# Data-scale follow-up to R006: the same model and optimizer settings on 20,000 fresh
# train-only micro-world examples (depths 1-3), 3 epochs = 3,750 steps, ~2 h on an
# RTX 2060. Dev comes from reasoning_v0, so checkpoints can be selected on it.
model_config_path = "configs/models/direct_modernbert_ft_joint.toml"
dataset = "artifacts/datasets/microworld_train20k_v0"
dev_dataset = "artifacts/datasets/microworld_v0"
train_split = "train"
dev_split = "dev"
batch_size = 16
micro_batch_size = 4
learning_rate = 1e-4
encoder_learning_rate = 2e-5
weight_decay = 0.01
warmup_fraction = 0.06
schedule = "linear"
precision = "fp16-mixed"
grad_clip = 1.0
seed = 0
device = "cuda"
log_every_steps = 50
epochs = 3
checkpoint_every_steps = 625
