# Statement memory v0 (decision 0012): GenericsKB-Best generic statements, each a node
# about one concept term, keyed by the same frozen retrieval encoder as wordnet_v0.
# Download (39 MB, CC-BY-4.0) into artifacts/sources/generics_kb_best.parquet from
# https://huggingface.co/datasets/community-datasets/generics_kb/resolve/<hf_revision>/generics_kb_best/train-00000-of-00001.parquet
memory_id = "generics_v0"
source = "generics_kb"
parquet = "artifacts/sources/generics_kb_best.parquet"
parquet_sha256 = "31a202ba46801536c186baf631092fb0d5b37314b16592a2a5fb80305a49206e"
hf_revision = "aba8bf00c76fe8cfd87bc6abd861b5c3f6d8acfc"
device = "cuda"
batch_size = 512

[encoder]
model = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
pooling = "cls"
max_length = 128
query_prefix = "Represent this sentence for searching relevant passages: "
