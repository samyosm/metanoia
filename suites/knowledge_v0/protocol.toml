Stage-2 testbed (decision 0010): science multiple choice without a passage (OpenBookQA,
ARC-Easy, ARC-Challenge). The direct model must rely on what it already knows; candidate
expansion over a concept memory should add evidence it lacks. The main endpoint is test
accuracy and NLL per source, and later their change with the expansion budget.
"""
