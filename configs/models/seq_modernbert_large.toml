# ModernBERT-large (395.9M), marker encoding, sequential positions; for a 24 GB card.
# Single-sequence marker encoding (decision 0015) on a fine-tuned ModernBERT-base: all
# options in one marked sequence, one encoder pass per request, random option order in
# training, rotation averaging off (set sequence.rotations for inference).
name = "seq_modernbert_large"

[encoder]
kind = "hf"
model = "answerdotai/ModernBERT-large"
revision = "45bb4654a4d5aaff24dd11d4781fa46d39bf8c13"
max_length = 512
pooling = "mean"
frozen = false
gradient_checkpointing = true

[scorer]
kind = "direct"
candidate_encoding = "sequence"

[scorer.sequence]
head_layers = 2
head_heads = 8
head_ff_mult = 2
dropout = 0.1
option_max_tokens = 48
head_max_len = 256
shuffle_options = true
rotations = 1
position_reset = false
