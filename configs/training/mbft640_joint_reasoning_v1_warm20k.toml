name = "mbft640_joint_reasoning_v1_warm20k"
# Converged reference direct baseline for suites/reasoning_v1 (after R011, which stopped
# while still improving): the R008 recipe (warm start from R005) on 20,000 fresh padded
# train examples (depths 1-3), 1 epoch = 1,250 steps, ~1 h 50 min on an RTX 2060.
# Any Stage-3a model is trained on the same data, schedule and initialization.
model_config_path = "configs/models/direct_modernbert_ft_joint_640.toml"
init_from = "artifacts/predictors/mbft_joint_mcqa_v0"
dataset = "artifacts/datasets/microworld_v1_train20k"
dev_dataset = "artifacts/datasets/microworld_v1"
train_split = "train"
dev_split = "dev"
max_dev_examples = 400
subset = "random"
batch_size = 16
micro_batch_size = 4
learning_rate = 1e-4
encoder_learning_rate = 2e-5
weight_decay = 0.01
warmup_fraction = 0.06
schedule = "linear"
precision = "fp16-mixed"
grad_clip = 1.0
seed = 0
device = "cuda"
log_every_steps = 50
epochs = 1
checkpoint_every_steps = 125
