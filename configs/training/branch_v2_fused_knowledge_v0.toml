name = "branch_v2_fused_knowledge_v0"
# EXPAND v2 with fused proposals (decision 0014), matched to R020 and R024
# (branch_v2_{retrieved,random,none}_knowledge_v0): same data, schedule, seed and
# initialization (R005). Widths per batch from {0, 1, 2, 4, 8}; dev loss at width 8.
model_config_path = "configs/models/branch_v2_fused.toml"
init_from = "artifacts/predictors/mbft_joint_mcqa_v0"
dataset = "artifacts/datasets/knowledge_v0"
train_split = "train"
dev_split = "dev"
batch_size = 16
micro_batch_size = 8
learning_rate = 1e-4
encoder_learning_rate = 2e-5
weight_decay = 0.01
warmup_fraction = 0.06
schedule = "linear"
precision = "fp16-mixed"
grad_clip = 1.0
seed = 0
device = "cuda"
log_every_steps = 50
epochs = 2
checkpoint_each_epoch = true
