# Position-reset variant, 3 epochs: did the 1-epoch collapse (R032) come from too few steps?
# Matched to mbft_joint_sciq_quick (R004): same data, steps and learning rates; marker encoding.
name = "seq_reset_sciq_e3"
# Quick demo predictor: 2,400 random SciQ train examples (~8 min on an RTX 2060).
model_config_path = "configs/models/seq_modernbert_base_reset.toml"
dataset = "artifacts/datasets/mcqa_sciq_v0"
train_split = "train"
dev_split = "dev"
batch_size = 16
micro_batch_size = 8
learning_rate = 1e-4
encoder_learning_rate = 2e-5
weight_decay = 0.01
warmup_fraction = 0.06
schedule = "linear"
precision = "fp16-mixed"
grad_clip = 1.0
seed = 0
device = "cuda"
log_every_steps = 50
epochs = 3
max_train_examples = 2400
subset = "random"
max_dev_examples = 400
