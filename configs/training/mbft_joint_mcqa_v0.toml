name = "mbft_joint_mcqa_v0"
# Full run: all 99,459 train examples, 1 epoch, ~5 h on an RTX 2060.
model_config_path = "configs/models/direct_modernbert_ft_joint.toml"
dataset = "artifacts/datasets/mcqa_v0"
train_split = "train"
dev_split = "dev"
batch_size = 16
micro_batch_size = 4
learning_rate = 1e-4
encoder_learning_rate = 2e-5
weight_decay = 0.01
warmup_fraction = 0.06
schedule = "linear"
precision = "fp16-mixed"
grad_clip = 1.0
seed = 0
device = "cuda"
log_every_steps = 50
epochs = 1
subset = "random"
max_dev_examples = 1000
