status = "baseline"
summary = "Quick marker-encoding model (all options in one sequence), trained in 83 seconds on 2,400 SciQ questions."
headline = "Test accuracy 45.2% (RACE 36.0%, SciQ 90.8%): 2.6 points above the joint-encoding model trained the same way. With 4-rotation averaging (`rotations = 4`): 47.8%, calibrated NLL 1.159."
good_at = [
  "Short science questions with a supporting sentence (SciQ): about 91% correct.",
  "Transfers to RACE better than the joint quick model (36.0% against 32.8%) after seeing only SciQ.",
  "Averaging over 4 rotations of the option order adds 2.6 points (RACE 38.9%, SciQ 92.2%) and improves calibration (ECE 2.8%), at 4 times the inference cost; use `--rotations 4`.",
]
weak_at = [
  "Raw probabilities are overconfident (ECE 26%); a temperature of 3.5 fixes the whole set but makes easy science answers under-confident (SciQ ECE 14.8% calibrated against 1.8% raw).",
  "Position bias of the marker format is not yet measured; options are read in the order given.",
  "Trained on one source and one epoch: not a general model.",
]
different = "One encoder pass per question: every option is a marked slot in a single sequence and attends to the other options, scored by a two-layer head (decision 0015, after Laya)."
evidence = ["R031", "R035", "R034", "R004", "R029"]

