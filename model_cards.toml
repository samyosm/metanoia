# Model cards: what each trained predictor can do, grounded in RESULT_LOG.md.
#
# Rules (see CLAUDE.md):
# - One card per bundle directory under metanoia/artifacts/predictors/.
# - `predictor_id` must match the bundle; a card never describes other weights.
# - `checkpoint` (optional) names the dev-selected checkpoint under the bundle's
#   checkpoints/ that the interface serves; `predictor_id` is then that checkpoint's.
# - Every claim comes from a logged result; cite its entry IDs in `evidence`.
# - When a new result changes what a model is known to do, update its card in the same
#   change as the RESULT_LOG entry.
#
# Fields: status is one of "recommended", "baseline", "not useful".
# Chance on all current suites is 25% accuracy (4 options).

[models.mbft_joint_mcqa_v0]
predictor_id = "direct_modernbert_ft_joint@7345459d01da"
status = "recommended"
summary = "General reading-comprehension chooser. The only model here that is useful on real questions."
headline = "Test accuracy 76.8% (RACE 73.0%, SciQ 95.6%), well calibrated (ECE 1.6%)."
good_at = [
  "Multiple-choice questions about a passage you supply: who, what or why, main idea, what a word refers to.",
  "Science facts where the context mentions the answer (SciQ style): about 96% correct.",
  "Honest confidence on questions like its training data: when it says 70%, it is right about 70% of the time on average.",
]
weak_at = [
  "Questions needing inference beyond the text, such as character traits or the author's intent: often right but unsure (for example 53% against 33%).",
  "Multi-step logic over rules (\"if A then B …\"): not tested on this model; every model tested on the rule suite is at chance.",
  "Contexts longer than about 384 tokens: the end is cut off (the Path view warns).",
  "No \"none of these\" option: it always spreads 100% over the candidates you give.",
  "Science questions with no passage (OpenBookQA, ARC): 50.7%. Pasting one relevant fact as the context lifts OpenBookQA from 39% to 62%.",
]
different = "ModernBERT-base fine-tuned end to end on 99,459 RACE + SciQ questions (1 epoch, about 5 h). Each candidate is read together with the question and context (joint encoding)."
evidence = ["R005", "R002", "R016", "R017"]

